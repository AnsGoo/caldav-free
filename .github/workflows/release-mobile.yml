# 一键构建全部客户端与服务端制品：Windows 安装包、macOS DMG、Android APK/AAB、
# iOS IPA、鸿蒙 HAP、飞牛 fnOS FPK，外加多架构 Docker 镜像。
#
# 触发方式：
#   * 发布 GitHub Release（published）—— 构建完成后自动把产物挂到该 Release。
#   * Actions → “Release Mobile” → Run workflow —— 只构建并保留 workflow artifacts；
#     如需挂到已有 Release，可填写 tag 输入框。
#
# 单个 job 可以临时关掉（仓库 → Settings → Variables）：
#   HARMONY_CI=false / FNOS_CI=false / DOCKER_CI=false
#
# 与旧的三条独立流水线一致，这里刻意不使用 Actions 缓存（无 actions/cache，
# flutter-action / setup-go / setup-node 的 cache 全关），保证每次发布都是干净
# runner 上的全量构建。Docker job 只用 registry 缓存，同样不占 Actions 额度。
name: Release Mobile

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：把本次构建挂到已有的 Release tag（留空则只保留 workflow artifacts）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 从 pubspec.yaml 读取版本号，供各端产物命名使用。
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read version from pubspec
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n1 | cut -d+ -f1)
          if [ -z "$version" ]; then
            echo "::error::Cannot read version from mobile/pubspec.yaml"
            exit 1
          fi
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version: $version ($tag)"

  android:
    name: Android APK + AAB
    needs: version
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build release APK and AAB
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p dist/android
          tag="${{ needs.version.outputs.tag }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
            "dist/android/caldav-free-android-$tag.apk"
          cp mobile/build/app/outputs/bundle/release/app-release.aab \
            "dist/android/caldav-free-android-$tag.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/android/*

  macos:
    name: macOS .app
    needs: version
    timeout-minutes: 60
    # macos-14（Intel x64）已于 2026-11-02 退役，继续用会直接报
    # "The configuration 'macos-14-arm64-us-default' is not supported"，
    # job 连一步都跑不起来。macos-15 是 arm64；Release 配置没设 ONLY_ACTIVE_ARCH，
    # 走 ARCHS_STANDARD 仍是 arm64+x86_64 通用二进制，下面有 lipo 校验兜底。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build release app
        working-directory: mobile
        run: |
          command -v pod >/dev/null || brew install cocoapods
          flutter pub get
          flutter build macos --release

      - name: Collect artifacts
        env:
          # 设为 true 时额外产出 arm64 / x64 两个单架构 DMG（各约 12 MB，
          # 通用版 25 MB）。默认只出通用版：一份装两种机器，用户不用认架构。
          MACOS_SPLIT_ARCH: ${{ vars.MACOS_SPLIT_ARCH }}
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          tag="${{ needs.version.outputs.tag }}"
          cd mobile/build/macos/Build/Products/Release

          app="caldav-free.app"
          exe="$app/Contents/MacOS/caldav-free"
          [ -f "$exe" ] || { echo "::error::没找到产物 $exe"; ls -la; exit 1; }

          # 换成 arm64 宿主机后必须确认二进制仍是通用的：Xcode 的 ARCHS_STANDARD
          # 在 macOS 上是 arm64 x86_64，Release 又没有 ONLY_ACTIVE_ARCH，
          # 所以正常应为 "x86_64 arm64"。只剩一种架构说明某处按宿主架构裁了，
          # 那样 Intel 用户会直接打不开。
          archs="$(lipo -archs "$exe")"
          echo "二进制架构: $archs"
          # 不用 printf | grep -q：grep 提前退出会让写入方吃 SIGPIPE，
          # 在 pipefail 下把判断结果反转。纯字符串匹配最稳。
          # 用子串而非精确匹配，因为 lipo 可能报 arm64e / arm64e.x1 这类变体。
          has_arm64=0
          has_x86=0
          case "$archs" in *arm64*) has_arm64=1 ;; esac
          case "$archs" in *x86_64*) has_x86=1 ;; esac
          if [ "$has_arm64" != 1 ] || [ "$has_x86" != 1 ]; then
            echo "::error::产物不是通用二进制（$archs），会有一类 Mac 打不开"
            exit 1
          fi

          split_flag=""
          if [ "${MACOS_SPLIT_ARCH:-}" = "true" ]; then split_flag="--split"; fi
          "$GITHUB_WORKSPACE/mobile/scripts/package-macos.sh" \
            "$app" "$GITHUB_WORKSPACE/dist/macos" "$tag" $split_flag
          ls -lh "$GITHUB_WORKSPACE/dist/macos/"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/macos/*

  windows:
    name: Windows installer
    needs: version
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build Windows release
        working-directory: mobile
        run: |
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        working-directory: mobile/windows/installer
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found. Inno Setup install failed."
          }
          & $iscc /DMyAppVersion=${{ needs.version.outputs.version }} caldav-free.iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item `
            "mobile/windows/installer/output/caldav-free-windows-x64.exe" `
            "dist/windows/caldav-free-windows-x64-${{ needs.version.outputs.tag }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*

  ios:
    name: iOS app / IPA
    needs: version
    # macos-15 ships Xcode 16.x; the UIScene/implicit-engine template needs a
    # recent toolchain than macos-14's default Xcode.
    runs-on: macos-15
    timeout-minutes: 70
    env:
      # Optional signing material. Without it the job builds an unsigned app
      # bundle; with it, a signed IPA is exported.
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Import signing material
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      - name: Build signed IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        working-directory: mobile
        run: |
          set -euo pipefail
          method="${IOS_EXPORT_METHOD:-app-store}"
          flutter pub get
          # The generated project has no team id; inject it so xcodebuild can
          # match the installed certificate and provisioning profile.
          sed -i '' \
            "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $IOS_TEAM_ID;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          flutter build ipa --release --export-method "$method"

      - name: Build unsigned app
        if: env.IOS_CERTIFICATE_BASE64 == ''
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/ios
          tag="${{ needs.version.outputs.tag }}"
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ]; then
            cp mobile/build/ios/ipa/*.ipa "dist/ios/caldav-free-ios-$tag.ipa"
          else
            cd mobile/build/ios/iphoneos
            ditto -c -k --sequesterRsrc --keepParent Runner.app \
              "$GITHUB_WORKSPACE/dist/ios/caldav-free-ios-$tag-unsigned.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/ios/*

  # 鸿蒙 HAP（未签名）。
  #
  # 跑在 GitHub 托管的 ubuntu-latest 的预构建容器里：
  #   ghcr.io/honjow/harmonyos-build-env:26.0-api26
  # 镜像里已经装好 API 26 的 command-line-tools（hvigorw / ohpm / node / JDK 17 / SDK），
  # DEVECO_SDK_HOME、HOS_SDK_HOME、PATH 全部配好 —— 不用装 SDK，也不用自托管 runner。
  # 镜像 tag 直接对应 API 版本，升 SDK 就改这一行。
  #
  # 镜像里没有 Flutter：鸿蒙版 flutter_flutter 得自己 clone（官方 Flutter 编不出 HAP），
  # 它的引擎产物由 flutter 首次运行时从华为 OBS 拉取
  # （flutter-ohos.obs.cn-south-1.myhuaweicloud.com，见 flutter_tools cache.dart）。
  #
  # 产物是 unsigned 包：模拟器可直接装，真机需要先配签名（见 docs/鸿蒙签名.md）。
  harmony:
    name: HarmonyOS HAP (unsigned)
    needs: version
    timeout-minutes: 90
    # 临时不想要鸿蒙产物，把仓库变量 HARMONY_CI 设为 false 即可跳过本 job。
    if: vars.HARMONY_CI != 'false'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/honjow/harmonyos-build-env:26.0-api26
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # 容器 job 的默认 shell 在部分 runner 上会落到 sh（dash），而 dash 不认
    # `set -o pipefail`，会直接以退出码 2 失败——表现为步骤里什么都没输出就红。
    # 显式指定 bash，所有 run 步骤才真正跑在 bash 下。
    defaults:
      run:
        shell: bash
    env:
      # 打成 tag 而不是分支：分支会漂，tag 可复现。本机 flutter --version 就是这一版。
      FLUTTER_OH_REF: "3.47.7+ohos-0.0.1-pre"
      FLUTTER_OH_REPO: "https://gitcode.com/openharmony-tpc/flutter_flutter.git"
      FLUTTER_DIR: "/opt/flutter_flutter"
      # 镜像里的工具链位置。显式声明而不是吃镜像 ENV：Prepare 步骤要用它写
      # local.properties 的 hwsdk.dir，一旦为空就会在 set -u 下直接中断。
      DEVECO_SDK_HOME: "/opt/harmonyos/command-line-tools/sdk"
      HOS_SDK_HOME: "/opt/harmonyos/command-line-tools/sdk"
    steps:
      - uses: actions/checkout@v4

      # 先确认容器里的东西齐不齐，缺了立刻报出来，别等到编译阶段才发现。
      - name: Verify container toolchain
        run: |
          set -euo pipefail
          # 开头就把环境摊开：这一步一旦失败，日志里能直接看到是 shell 不对还是缺东西。
          echo "shell: $BASH_VERSION (0=${0##*/})"
          echo "arch: $(uname -m)"
          echo "PATH=$PATH"

          # 镜像把工具链装在固定目录。不假设镜像的 ENV 一定能被继承——
          # 显式补进 PATH，并在 DEVECO_SDK_HOME 缺失时回落到默认位置。
          TOOLCHAIN=/opt/harmonyos/command-line-tools
          if [ -d "$TOOLCHAIN/bin" ]; then
            export PATH="$TOOLCHAIN/bin:$TOOLCHAIN/tool/node/bin:$PATH"
          fi
          export DEVECO_SDK_HOME="${DEVECO_SDK_HOME:-$TOOLCHAIN/sdk}"

          missing=""
          for c in git curl unzip xz java ohpm hvigorw node; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::容器里缺少:$missing —— 检查镜像 tag（当前 PATH=$PATH）"
            exit 1
          fi
          # 用 sed 而不是 `| head -1`：java -version 输出 3 行，head 提前关管道会让
          # java 吃 SIGPIPE 退出 141，pipefail 下整个 step 就挂了。sed 会读完输入。
          java -version 2>&1 | sed -n '1p'
          node -v
          ohpm -v 2>/dev/null || true
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          test -d "$DEVECO_SDK_HOME/default/openharmony" || {
            echo "::error::SDK 不在 $DEVECO_SDK_HOME/default/openharmony"
            exit 1
          }
          df -h / | tail -1

      # 本项目唯一的远程 ohpm 依赖是 devDependency @ohos/hypium（见 ohos/oh-package.json5），
      # 镜像里没有缓存，每轮都要从 ohpm.openharmony.cn 拉。镜像默认 retry_times=1、
      # fetch_timeout=60s，海外 runner 上一次抖动就整轮失败，所以放宽重试。
      - name: Harden ohpm for CI
        run: |
          set -euo pipefail
          ohpm config set retry_times 3
          ohpm config set fetch_timeout 180000
          ohpm config list | grep -E "registry|retry_times|fetch_timeout"

      # flutter_flutter 约 4GB（含 bin/cache 里的 Dart SDK 与引擎产物），
      # 按 tag 缓存，命中后省掉 clone 和那次 1~2GB 的下载。
      - name: Cache flutter_flutter
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_DIR }}
          key: flutter-oh-${{ env.FLUTTER_OH_REF }}

      - name: Prepare flutter and local.properties
        run: |
          set -euo pipefail

          # 镜像没设 JAVA_HOME，hvigorw 靠 PATH 里的 java 也能跑，但显式给出更稳。
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")" >> "$GITHUB_ENV"
          fi

          if [ ! -x "$FLUTTER_DIR/bin/flutter" ]; then
            rm -rf "$FLUTTER_DIR"
            ok=0
            for i in 1 2 3; do
              if git clone --depth 1 -b "$FLUTTER_OH_REF" "$FLUTTER_OH_REPO" "$FLUTTER_DIR"; then
                ok=1; break
              fi
              echo "clone 失败（第 $i 次），5 秒后重试"
              rm -rf "$FLUTTER_DIR"; sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::flutter_flutter clone 失败：$FLUTTER_OH_REPO ($FLUTTER_OH_REF)"
              exit 1
            fi
          else
            echo "复用缓存里的 flutter_flutter：$FLUTTER_DIR"
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"

          # local.properties 被 .gitignore 排除，checkout 后不存在。
          # hvigor 靠 hwsdk.dir 定位 SDK、flutter 靠 flutter.sdk 定位自己，缺一则直接失败。
          version=$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n1 || true)
          name=${version%%+*}
          code=${version##*+}
          if [ "$code" = "$version" ]; then code=1; fi
          {
            echo "hwsdk.dir=$DEVECO_SDK_HOME"
            echo "flutter.sdk=$FLUTTER_DIR"
            echo "flutter.versionName=$name"
            echo "flutter.versionCode=$code"
          } > mobile/ohos/local.properties
          cat mobile/ohos/local.properties

          # 首次调用只负责下载 Dart SDK（成功时就输出一行 "Downloading ..."），
          # 拿不到版本号，所以要跑两遍：第一遍预热，第二遍取版本。
          # 全程用重定向而不是管道 —— flutter --version 输出多行，`| head` 会让它
          # 吃 SIGPIPE 退出 141，在 pipefail 下直接把 step 干掉。
          "$FLUTTER_DIR/bin/flutter" --version > "$RUNNER_TEMP/fv.log" 2>&1 || true
          if ! grep -qi ohos "$RUNNER_TEMP/fv.log"; then
            "$FLUTTER_DIR/bin/flutter" --version > "$RUNNER_TEMP/fv.log" 2>&1 || true
          fi
          ver="$(head -n1 "$RUNNER_TEMP/fv.log" || true)"
          printf '>>> %s\n' "$ver"
          if ! grep -qi ohos "$RUNNER_TEMP/fv.log"; then
            echo "::error::这个 flutter 不是鸿蒙分支，编不出 HAP：$ver"
            tail -n 20 "$RUNNER_TEMP/fv.log" || true
            exit 1
          fi

      # 不能用 --fast：那只跑 hvigor，Dart 代码不会重新 AOT 编译，产物会是旧逻辑。
      - name: Build HAP
        working-directory: mobile
        run: MODE=release ./scripts/build-ohos.sh

      # flutter 只吐 exit code 255，真报错在 hvigor 的 debug 日志里。
      - name: Dump hvigor log on failure
        if: failure()
        run: |
          log=mobile/ohos/.hvigor/outputs/build-logs/build.log
          if [ -f "$log" ]; then
            grep -E "ERROR|Error Message|BUILD FAILED" "$log" | tail -n 40 || true
            echo "----- 末尾 80 行 -----"
            tail -n 80 "$log"
          fi

      - name: Collect artifact
        run: |
          set -euo pipefail
          hap=$(find mobile/ohos/entry/build -name '*.hap' | head -1 || true)
          if [ -z "$hap" ]; then
            echo "::error::构建结束但没有产出 .hap"
            ls -R mobile/ohos/entry/build 2>/dev/null | head -40 || true
            exit 1
          fi
          case "$hap" in
            *unsigned*) ;;
            *) echo "::warning::产物带签名，与预期不符：$hap" ;;
          esac
          mkdir -p dist/harmony
          out="dist/harmony/caldav-free-harmony-${{ needs.version.outputs.tag }}-unsigned.hap"
          cp "$hap" "$out"
          ls -lh "$out"
          sha256sum "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-release
          path: dist/harmony/*
          # 只是中转，最终由 publish job 挂到 Release，不用留太久。
          retention-days: 7

  # 飞牛 fnOS 原生安装包（FPK）。
  #
  # 打包逻辑全在 scripts/build-fnos-fpk.sh 里（前端构建 → 交叉编译 → 组装 app.tgz →
  # 出 .fpk），这里只负责装工具链、跑打包、跑冒烟。结构与 music-free 的一致。
  #
  # 两个架构各用一个原生 runner：服务端是纯 Go SQLite，CGO_ENABLED=0 本来交叉编译
  # 也能出包，但 arm64 包必须在一台真 arm64 Linux 上冒烟，否则等于没测。
  fnos:
    name: fnOS FPK (${{ matrix.arch }})
    needs: version
    # 临时不想出飞牛包，把仓库变量 FNOS_CI 设为 false 即可跳过本 job。
    if: vars.FNOS_CI != 'false'
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # 版本号统一取 mobile/pubspec.yaml（与各端产物同名），不用 packaging 里 manifest
      # 的默认值，避免两处版本漂移；脚本会在暂存目录里覆写，源 manifest 不动。
      FPK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate FPK structure
        run: ./scripts/validate-fnos-fpk.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 本仓库刻意不用 Actions 缓存（额度有限），setup-go 默认 cache: true，必须显式关。
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend + binary + FPK
        run: ./scripts/build-fnos-fpk.sh "${{ matrix.arch }}"

      # 在 runner 上真装一遍：解包 → 走 fnOS 的生命周期脚本 → 起服务 → 请求首页 → 停服。
      # 只验证"包能打出来"是不够的，脚本里引用的路径和端口才是实际会炸的地方。
      - name: Smoke test (install → start → HTTP 200 → stop)
        run: ./scripts/smoke-test-fpk.sh "packaging/fnos/dist/caldav-free-${FPK_VERSION}-${{ matrix.arch }}.fpk"

      - uses: actions/upload-artifact@v4
        with:
          name: fnos-release-${{ matrix.arch }}
          path: packaging/fnos/dist/*.fpk
          retention-days: 7
          if-no-files-found: error

  # Docker 镜像（linux/amd64 + linux/arm64，合并成多架构 manifest）。
  #
  # 推哪个仓库由凭据决定：
  #   * 配了 secrets.DOCKERHUB_USERNAME / DOCKERHUB_TOKEN → docker.io/<user>/caldav-free
  #   * 没配 → ghcr.io/<owner>/caldav-free，用 GITHUB_TOKEN 推，不依赖额外 secret
  # 标签策略：<tag>（如 v2.7.1）、<version>（2.7.1）、sha-<7 位>；正式 tag 才覆盖 latest。
  #
  # 分架构在两个原生 runner 上跑，最后用 imagetools 合并 manifest ——
  # 单 job 走 QEMU 模拟 arm64 的话，npm ci + go build 会慢一个量级。
  docker-meta:
    name: Docker metadata
    needs: version
    # 临时不想出镜像，把仓库变量 DOCKER_CI 设为 false 即可跳过。
    if: vars.DOCKER_CI != 'false'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.meta.outputs.registry }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - id: meta
        name: Resolve registry and tags
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="${{ needs.version.outputs.tag }}"

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            registry="docker.io"
            image="docker.io/${DOCKERHUB_USERNAME}/caldav-free"
          else
            registry="ghcr.io"
            # 仓库所有者可能带大写，镜像名必须全小写，否则 push 会被拒。
            owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
            image="ghcr.io/${owner}/caldav-free"
            echo "::notice::未配置 Docker Hub 凭据，改推 ${image}"
          fi

          # 用数组拼标签，别用多行字符串 —— 块标量里稍不留神就会把缩进空格
          # 一起打进镜像名里，push 时报 "invalid reference format"。
          tag_list=(
            "${image}:${tag}"
            "${image}:${version}"
            "${image}:sha-${GITHUB_SHA:0:7}"
          )
          # 预发布（tag 里带 -rc / -beta / -debug 之类）不覆盖 latest
          case "$tag" in
            *-*) ;;
            *) tag_list+=("${image}:latest") ;;
          esac
          tags="$(printf '%s\n' "${tag_list[@]}")"

          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<DOCKER_TAGS"
            printf '%s\n' "$tags"
            echo "DOCKER_TAGS"
          } >> "$GITHUB_OUTPUT"
          printf '镜像：%s\n标签：\n%s\n' "$image" "$tags"

  docker-build:
    name: Docker (${{ matrix.arch }})
    needs: [version, docker-meta]
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.docker-meta.outputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.docker-meta.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 每个架构先推到 temp-<arch>-<run_id>，由 docker-merge 合成正式 manifest。
      # 这样两条腿互不阻塞，单个架构失败也不会污染正式 tag。
      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ needs.docker-meta.outputs.image }}:temp-${{ matrix.arch }}-${{ github.run_id }}
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.title=caldav-free
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 只走 registry 缓存（存在镜像仓库里），不用 type=gha ——
          # 本仓库刻意不占 Actions 缓存额度。代价是首次冷构建 2~3 分钟。
          cache-from: type=registry,ref=${{ needs.docker-meta.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.docker-meta.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

  # 镜像自带管理后台这件事必须有自动化兜底：容器能起来、/healthz 200，并不代表
  # 前端打进去了 —— go:embed 拿到空 dist 时进程照样启动，只是 /admin/ 会 500。
  # 两个架构各验一次：前端是在各自 runner 上编译的，产物不一定同源。
  docker-smoke:
    name: Docker smoke (${{ matrix.arch }})
    needs: [version, docker-meta, docker-build]
    if: vars.DOCKER_CI != 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.docker-meta.outputs.image }}
      RUN_ID: ${{ github.run_id }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Log in to Docker Hub
        if: needs.docker-meta.outputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.docker-meta.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull platform image
        run: docker pull "${IMAGE}:temp-${ARCH}-${RUN_ID}"

      - name: Probe /healthz and /admin/
        run: |
          set -euo pipefail
          ref="${IMAGE}:temp-${ARCH}-${RUN_ID}"
          docker run -d --name cf-smoke -p 5232:5232 \
            -e CALDAV_ADMIN_PASSWORD='Smoke#2026' "$ref"
          # 失败时把容器日志带出来，否则只有一行 curl 的 000，没法定位。
          trap 'docker logs cf-smoke 2>&1 | tail -20 || true' ERR
          trap 'docker rm -f cf-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
              http://127.0.0.1:5232/healthz || true)"
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::/healthz 30s 内没有就绪"
            exit 1
          fi

          html="$(curl -sf --max-time 5 http://127.0.0.1:5232/admin/)" \
            || { echo "::error::/admin/ 拉取失败，镜像里很可能没有前端"; exit 1; }
          # 用 here-string 而不是管道喂 grep -q：grep 命中即退出会让上游
          # printf 收到 SIGPIPE，在 pipefail 下整个脚本判 141。
          grep -q 'id="app"' <<< "$html" \
            || { echo "::error::/admin/ 返回的不是管理后台页面"; exit 1; }

          asset="$(grep -oE -m1 '/admin/assets/[^"]+\.js' <<< "$html" || true)"
          if [ -z "$asset" ]; then
            echo "::error::/admin/ 的 HTML 里没有 JS bundle 引用"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            "http://127.0.0.1:5232${asset}")"
          if [ "$code" != "200" ]; then
            echo "::error::静态资源 ${asset} 返回 ${code}"
            exit 1
          fi
          echo "管理后台可用：${asset} 200"

  docker-merge:
    name: Docker multi-arch manifest
    needs: [version, docker-meta, docker-build, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.docker-meta.outputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.docker-meta.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用一个 manifest list 把 amd64 / arm64 两个镜像指向同一批标签。
      # 临时标签（temp-*）不删：Docker Hub 与 GHCR 都没有删标签的 CLI，
      # 而它们只是 manifest 指针，几乎不占空间；run_id 每次不同，不会互相覆盖。
      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ needs.docker-meta.outputs.image }}
          TAGS: ${{ needs.docker-meta.outputs.tags }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            # 不要写成 `[ -n "$t" ] && args+=(...)`：某行为空时整个 `&&` 返回 1，
            # 在 set -e 下会当场退出脚本。
            if [ -n "$t" ]; then args+=(-t "$t"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}:temp-amd64-${RUN_ID}" \
            "${IMAGE}:temp-arm64-${RUN_ID}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ needs.docker-meta.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # Release 事件，或手动运行且填写了 tag 时，把各端产物统一挂到该 Release。
  publish:
    name: Attach assets to release
    # always()：只要 version 读到了，就别因为某一端失败（或 harmony 的 runner 没上线）
    # 而让其他平台的产物上不了 Release。缺哪个端就少传哪个产物。
    if: always() && !cancelled() && (github.event_name == 'release' || inputs.tag) && needs.version.result == 'success'
    needs: [version, android, macos, windows, ios, harmony, fnos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.version.outputs.tag }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
