name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build admin UI
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/caldav-free ./cmd/caldav-free
