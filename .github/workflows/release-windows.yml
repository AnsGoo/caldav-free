name: Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build Windows release
        working-directory: mobile
        run: |
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        working-directory: mobile/windows/installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" caldav-free.iss

      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "mobile/windows/installer/output/caldav-free-windows-x64.exe" --clobber

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: windows-release
          path: mobile/windows/installer/output/caldav-free-windows-x64.exe
