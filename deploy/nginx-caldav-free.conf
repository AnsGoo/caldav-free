server {
    listen 80;
    server_name caldav-free.byteportrait.com;
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name caldav-free.byteportrait.com;

    ssl_certificate     /etc/caldav-free/tls/fullchain.pem;
    ssl_certificate_key /etc/caldav-free/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    # CalDAV discovery: serve the root resource directly instead of redirecting.
    # Some mobile CalDAV clients do not follow the .well-known redirect.
    location = /.well-known/caldav {
        proxy_pass http://127.0.0.1:5232/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /.well-known/caldav/ {
        proxy_pass http://127.0.0.1:5232/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The admin UI and JSON API are guarded by the application session login
    # only; no extra HTTP Basic Auth layer sits in front of them.
    location / {
        proxy_pass http://127.0.0.1:5232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}
