name: caldav_free
description: "caldav-free client (Android/Windows): offline-first tasks with pull/push sync, reminders, trash, recurrence and board/matrix/timeline views."
publish_to: 'none'
version: 2.7.1+19

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  http: 1.6.0
  path: 1.9.1
  provider: 6.1.5+1
  timezone: ^0.11.2
  uuid: 4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
