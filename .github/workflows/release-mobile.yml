# 一键构建四端客户端：Windows 安装包、macOS 应用包、Android APK/AAB、iOS IPA。
#
# 触发方式：
#   * 发布 GitHub Release（published）—— 构建完成后自动把产物挂到该 Release。
#   * Actions → “Release Mobile” → Run workflow —— 只构建并保留 workflow artifacts；
#     如需挂到已有 Release，可填写 tag 输入框。
#
# 与旧的三条独立流水线一致，这里刻意不使用任何缓存（无 actions/cache，
# flutter-action cache: false），保证每次发布都是干净 runner 上的全量构建。
name: Release Mobile

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：把本次构建挂到已有的 Release tag（留空则只保留 workflow artifacts）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 从 pubspec.yaml 读取版本号，供三端产物命名和 Windows 安装包使用。
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read version from pubspec
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n1 | cut -d+ -f1)
          if [ -z "$version" ]; then
            echo "::error::Cannot read version from mobile/pubspec.yaml"
            exit 1
          fi
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version: $version ($tag)"

  android:
    name: Android APK + AAB
    needs: version
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build release APK and AAB
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p dist/android
          tag="${{ needs.version.outputs.tag }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
            "dist/android/caldav-free-android-$tag.apk"
          cp mobile/build/app/outputs/bundle/release/app-release.aab \
            "dist/android/caldav-free-android-$tag.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/android/*

  macos:
    name: macOS .app
    needs: version
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build release app
        working-directory: mobile
        run: |
          command -v pod >/dev/null || brew install cocoapods
          flutter pub get
          flutter build macos --release

      - name: Collect artifacts
        run: |
          mkdir -p dist/macos
          tag="${{ needs.version.outputs.tag }}"
          cd mobile/build/macos/Build/Products/Release
          ditto -c -k --keepParent caldav-free.app \
            "$GITHUB_WORKSPACE/dist/macos/caldav-free-macos-arm64-$tag.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/macos/*

  windows:
    name: Windows installer
    needs: version
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build Windows release
        working-directory: mobile
        run: |
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        working-directory: mobile/windows/installer
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found. Inno Setup install failed."
          }
          & $iscc /DMyAppVersion=${{ needs.version.outputs.version }} caldav-free.iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item `
            "mobile/windows/installer/output/caldav-free-windows-x64.exe" `
            "dist/windows/caldav-free-windows-x64-${{ needs.version.outputs.tag }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*

  ios:
    name: iOS app / IPA
    needs: version
    # macos-15 ships Xcode 16.x; the UIScene/implicit-engine template needs a
    # recent toolchain than macos-14's default Xcode.
    runs-on: macos-15
    timeout-minutes: 70
    env:
      # Optional signing material. Without it the job builds an unsigned app
      # bundle; with it, a signed IPA is exported.
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Import signing material
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      - name: Build signed IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        working-directory: mobile
        run: |
          set -euo pipefail
          method="${IOS_EXPORT_METHOD:-app-store}"
          flutter pub get
          # The generated project has no team id; inject it so xcodebuild can
          # match the installed certificate and provisioning profile.
          sed -i '' \
            "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $IOS_TEAM_ID;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          flutter build ipa --release --export-method "$method"

      - name: Build unsigned app
        if: env.IOS_CERTIFICATE_BASE64 == ''
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/ios
          tag="${{ needs.version.outputs.tag }}"
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ]; then
            cp mobile/build/ios/ipa/*.ipa "dist/ios/caldav-free-ios-$tag.ipa"
          else
            cd mobile/build/ios/iphoneos
            ditto -c -k --sequesterRsrc --keepParent Runner.app \
              "$GITHUB_WORKSPACE/dist/ios/caldav-free-ios-$tag-unsigned.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/ios/*

  # 鸿蒙 HAP（未签名）。
  #
  # 为什么这个 job 必须跑在自托管 runner 上：鸿蒙 SDK（command-line-tools，
  # 解压后约 6.5 GB）需要在华为开发者站点登录后下载，GitHub 托管 runner 上
  # 既拿不到、也放不下；用第三方镜像分发 SDK 还有授权问题。而开发机本来就已经
  # 装好了整套工具链，自托管还能复用 hvigor 的增量缓存。
  #
  # 一次性前置：
  #   1. 在装着 DevEco Studio + 鸿蒙版 flutter_flutter 的 Mac 上注册 runner，
  #      给它打上 harmonyos 标签（Settings → Actions → Runners → New self-hosted runner）
  #   2. 确认该机器上 ./mobile/scripts/build-ohos.sh 能正常出包
  #   3. 路径不一致时用仓库变量覆盖：
  #        HARMONY_FLUTTER_DIR   鸿蒙版 flutter_flutter 根目录（默认 ~/flutter_flutter）
  #        HARMONY_SDK_DIR       command-line-tools/sdk（默认 ~/Documents/command-line-tools/sdk）
  #
  # 产物是 unsigned 包：模拟器可直接装，真机需要先配签名（见 docs/鸿蒙签名.md）。
  harmony:
    name: HarmonyOS HAP (unsigned)
    needs: version
    timeout-minutes: 60
    # runner 离线时 job 会一直排队并把 publish 拖住；临时不想要鸿蒙产物就设仓库变量
    # HARMONY_CI=false 跳过本 job。
    if: vars.HARMONY_CI != 'false'
    # 标签改了记得同步这里。
    runs-on: [self-hosted, macOS, harmonyos]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ohos toolchain
        env:
          HARMONY_FLUTTER_DIR: ${{ vars.HARMONY_FLUTTER_DIR }}
          HARMONY_SDK_DIR: ${{ vars.HARMONY_SDK_DIR }}
        run: |
          set -euo pipefail
          FLUTTER_DIR="${HARMONY_FLUTTER_DIR:-$HOME/flutter_flutter}"
          SDK_DIR="${HARMONY_SDK_DIR:-$HOME/Documents/command-line-tools/sdk}"

          if [ ! -x "$FLUTTER_DIR/bin/flutter" ]; then
            echo "::error::找不到鸿蒙版 flutter：$FLUTTER_DIR —— 设置仓库变量 HARMONY_FLUTTER_DIR"
            exit 1
          fi
          if [ ! -d "$SDK_DIR/default" ]; then
            echo "::error::找不到鸿蒙 SDK：$SDK_DIR —— 设置仓库变量 HARMONY_SDK_DIR"
            exit 1
          fi

          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$SDK_DIR")/bin" >> "$GITHUB_PATH"

          if [ -d /Applications/DevEco-Studio.app/Contents/jbr/Contents/Home ]; then
            echo "JAVA_HOME=/Applications/DevEco-Studio.app/Contents/jbr/Contents/Home" >> "$GITHUB_ENV"
            echo "/Applications/DevEco-Studio.app/Contents/jbr/Contents/Home/bin" >> "$GITHUB_PATH"
            export JAVA_HOME=/Applications/DevEco-Studio.app/Contents/jbr/Contents/Home
          fi

          # GITHUB_PATH 只对后续 step 生效，本 step 里要自己 export，否则下面的
          # flutter --version 会 command not found。set -u 下 $JAVA_HOME 可能未定义，
          # 所以用 extra_java 兜一层，避免拼出空的 PATH 段。
          extra_java=""
          if [ -n "${JAVA_HOME:-}" ]; then extra_java=":$JAVA_HOME/bin"; fi
          export PATH="$FLUTTER_DIR/bin:$(dirname "$SDK_DIR")/bin$extra_java:$PATH"

          # local.properties 被 .gitignore 排除，checkout 后是空的。
          # hvigor 靠 hwsdk.dir 定位 SDK、flutter 靠 flutter.sdk 定位自己，缺一则构建直接失败。
          version=$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n1 || true)
          name=${version%%+*}
          code=${version##*+}
          if [ "$code" = "$version" ]; then code=1; fi
          {
            echo "hwsdk.dir=$SDK_DIR"
            echo "flutter.sdk=$FLUTTER_DIR"
            echo "flutter.versionName=$name"
            echo "flutter.versionCode=$code"
          } > mobile/ohos/local.properties

          # 注意 pipefail：flutter --version 输出多行，head 提前关管道会让 flutter
          # 吃 SIGPIPE 退出 141，不加 || true 整个 step 会被 set -e 干掉。
          ver="$(flutter --version 2>/dev/null | head -n1 || true)"
          printf '%s\n' "$ver"
          if ! printf '%s' "$ver" | grep -q ohos; then
            echo "::error::这个 flutter 不是鸿蒙分支，编不出 HAP：$ver"
            exit 1
          fi

      # 不能用 --fast：那只跑 hvigor，Dart 代码不会重新 AOT 编译，产物会是旧逻辑。
      - name: Build HAP
        working-directory: mobile
        run: MODE=release ./scripts/build-ohos.sh

      - name: Collect artifact
        run: |
          set -euo pipefail
          hap=$(find mobile/ohos/entry/build -name '*.hap' | head -1 || true)
          if [ -z "$hap" ]; then
            echo "::error::构建结束但没有产出 .hap"
            ls -R mobile/ohos/entry/build 2>/dev/null | head -40 || true
            exit 1
          fi
          case "$hap" in
            *unsigned*) ;;
            *) echo "::warning::产物带签名，与预期不符：$hap" ;;
          esac
          mkdir -p dist/harmony
          out="dist/harmony/caldav-free-harmony-${{ needs.version.outputs.tag }}-unsigned.hap"
          cp "$hap" "$out"
          ls -lh "$out"
          shasum -a 256 "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-release
          path: dist/harmony/*

  # Release 事件，或手动运行且填写了 tag 时，把各端产物统一挂到该 Release。
  publish:
    name: Attach assets to release
    # always()：只要 version 读到了，就别因为某一端失败（或 harmony 的 runner 没上线）
    # 而让其他平台的产物上不了 Release。缺哪个端就少传哪个产物。
    if: always() && !cancelled() && (github.event_name == 'release' || inputs.tag) && needs.version.result == 'success'
    needs: [version, android, macos, windows, ios, harmony]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.version.outputs.tag }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
