# 刻意不启用任何缓存：不用 actions/cache，setup-java 与 flutter-action 的 cache 也关闭，
# 每次发布都在干净 runner 上全量构建，避免缓存产物混进 release。
name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: false

      - name: Build release APK and AAB
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd mobile/build/app/outputs
          cp flutter-apk/app-release.apk "caldav-free-android-$TAG.apk"
          cp bundle/release/app-release.aab "caldav-free-android-$TAG.aab"
          gh release upload "$TAG" \
            "caldav-free-android-$TAG.apk" \
            "caldav-free-android-$TAG.aab" \
            --clobber

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: android-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
