# 注意：本仓库刻意不使用 GitHub Actions 缓存（额度有限）。
#
# actions/setup-go 从 v3 起默认 cache: true，会自动对 Go 模块和构建产物
# 做 actions/cache 存取；这里必须显式关闭。actions/setup-node 默认不缓存，
# 保持不填 cache 即可。改动前请先确认不会引入任何缓存。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build admin UI
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Test
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/caldav-free ./cmd/caldav-free
