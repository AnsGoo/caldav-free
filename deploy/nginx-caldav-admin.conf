server {
    listen 127.0.0.1:5234;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /admin;
    }

    # Only the admin UI is exposed here; CalDAV paths are intentionally blocked.
    # Access is guarded by the application session login, not HTTP Basic Auth.
    location ~ ^/(admin|login|logout|assets|api)(/|$) {
        proxy_pass http://127.0.0.1:5232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
